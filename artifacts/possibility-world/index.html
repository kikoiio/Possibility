<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14201a" />
    <title>Possibility · 雾岚庄园</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2f1e9;
        --muted: #c4cdc5;
        --line: rgba(239, 244, 236, .2);
        --glass: rgba(20, 30, 24, .82);
        --glass-soft: rgba(20, 30, 24, .62);
        --lime: #d4ee7d;
        --coral: #ed9a7e;
        --blue: #a2c5d1;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #14201a; color: var(--ink); }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

      .world { position: fixed; inset: 0; isolation: isolate; overflow: hidden; background: #26352d; }
      .art-layer { position: absolute; inset: 0; transform-origin: 0 0; transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom, 1)); transition: transform .55s cubic-bezier(.2,.7,.15,1); cursor: grab; touch-action: none; }
      .art-layer.dragging { cursor: grabbing; transition: none; }
      .world-art { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 48%; user-select: none; -webkit-user-drag: none; }
      .world-shade { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg, rgba(10,18,13,.55), transparent 23%, transparent 59%, rgba(8,15,11,.15) 72%, rgba(8,15,11,.76)); }
      .world-glint { position: absolute; z-index: 2; left: 51%; top: 51%; width: 11px; height: 11px; border-radius: 50%; background: #ffe7a5; box-shadow: 0 0 12px 5px rgba(255,214,130,.42); animation: lamp 2.8s ease-in-out infinite; pointer-events: none; }
      @keyframes lamp { 0%,100% { opacity: .7; box-shadow: 0 0 10px 3px rgba(255,214,130,.3); } 50% { opacity: 1; box-shadow: 0 0 17px 8px rgba(255,214,130,.55); } }
      @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes ping { 0% { transform: scale(.55); opacity: .75; } 100% { transform: scale(1.9); opacity: 0; } }

      .top-hud { position: absolute; z-index: 5; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-start; padding: 19px 23px; pointer-events: none; }
      .brand-block, .world-clock, .top-tools { pointer-events: auto; }
      .brand-block { display: flex; align-items: flex-start; gap: 12px; text-shadow: 0 1px 8px rgba(0,0,0,.38); }
      .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.5); border-radius: 9px; background: rgba(20,30,24,.48); color: var(--lime); font-family: Georgia, serif; font-size: 20px; }
      .brand-name { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
      .world-name { margin-top: 3px; color: #e6ece4; font-size: 11px; }
      .world-clock { display: flex; align-items: center; gap: 17px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--glass-soft); backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(0,0,0,.12); }
      .clock-main { font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .clock-date { color: var(--muted); font-size: 10px; margin-top: 2px; }
      .live-state { display: flex; align-items: center; gap: 7px; color: #dcebc4; font-size: 10px; white-space: nowrap; }
      .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 9px rgba(212,238,125,.65); }
      .top-tools { position: absolute; top: 82px; right: 22px; display: flex; flex-direction: column; gap: 7px; }
      .tool-button { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 7px; background: var(--glass-soft); backdrop-filter: blur(8px); color: #f3f4ee; font-size: 19px; transition: background .15s, border-color .15s; }
      .tool-button:hover { border-color: rgba(212,238,125,.72); background: rgba(30,45,35,.9); }

      .map-markers { position: absolute; z-index: 3; inset: 0; pointer-events: none; }
      .map-marker { position: absolute; transform: translate(-50%,-50%); pointer-events: auto; }
      .place-marker { display: flex; align-items: center; gap: 7px; border: 1px solid rgba(248,249,242,.56); border-radius: 5px; padding: 5px 8px; background: rgba(18,28,22,.62); color: #f8f8f1; font-size: 10px; font-weight: 650; text-shadow: 0 1px 3px rgba(0,0,0,.7); box-shadow: 0 3px 10px rgba(0,0,0,.16); backdrop-filter: blur(5px); white-space: nowrap; transition: transform .14s, background .14s; }
      .place-marker:hover { transform: translate(-50%,-50%) scale(1.06); background: rgba(23,39,28,.92); }
      .place-glyph { color: var(--lime); font-size: 13px; }
      .resident-marker { display: flex; flex-direction: column; align-items: center; gap: 1px; border: 0; padding: 0; background: transparent; filter: drop-shadow(0 3px 3px rgba(0,0,0,.62)); }
      .resident-sprite { width: 43px; height: 57px; object-fit: contain; image-rendering: pixelated; animation: breathe 3.1s ease-in-out infinite; }
      .resident-marker:nth-child(2) .resident-sprite { animation-delay: .7s; }
      .resident-marker:nth-child(3) .resident-sprite { animation-delay: 1.3s; }
      .resident-label { padding: 3px 6px; border: 1px solid rgba(255,255,255,.38); border-radius: 4px; background: rgba(17,27,21,.77); color: white; font-size: 9px; white-space: nowrap; }
      .resident-marker.selected .resident-label { border-color: var(--lime); color: var(--lime); }
      .resident-pulse { position: absolute; top: 19px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
      .resident-pulse::after { content: ""; position: absolute; inset: -3px; border: 1px solid var(--coral); border-radius: 50%; animation: ping 1.8s ease-out infinite; }

      .entity-panel { position: absolute; z-index: 6; top: 86px; right: 72px; width: min(316px, calc(100vw - 32px)); max-height: calc(100vh - 244px); overflow: auto; padding: 17px 17px 16px; border: 1px solid rgba(234,241,231,.22); border-radius: 8px; background: var(--glass); backdrop-filter: blur(14px); box-shadow: 0 12px 36px rgba(0,0,0,.24); }
      .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .panel-kicker { color: #b9c7bb; font-size: 9px; letter-spacing: .08em; }
      .close-button { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); font-size: 17px; }
      .entity-main { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
      .entity-image { width: 56px; height: 66px; object-fit: contain; image-rendering: pixelated; flex: none; }
      .entity-glyph { display: grid; place-items: center; width: 56px; height: 56px; border: 1px solid rgba(212,238,125,.35); border-radius: 8px; background: rgba(212,238,125,.09); color: var(--lime); font-size: 24px; flex: none; }
      .entity-main h2 { margin: 0; font-size: 17px; line-height: 1.3; }
      .entity-place { margin-top: 4px; color: var(--muted); font-size: 10px; }
      .entity-activity { margin: 16px 0 0; color: #e3e8df; font-size: 12px; line-height: 1.7; }
      .entity-quote { margin: 12px 0 0; padding-left: 10px; border-left: 2px solid #bbd36f; color: #c4d1bf; font-family: Georgia, serif; font-size: 11px; line-height: 1.65; }
      .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
      .panel-action { min-height: 36px; border: 1px solid rgba(240,245,236,.27); border-radius: 5px; background: rgba(255,255,255,.07); color: #f4f4ed; padding: 7px 9px; font-size: 10px; line-height: 1.4; }
      .panel-action.primary { border-color: var(--lime); background: var(--lime); color: #28341e; font-weight: 700; }
      .panel-action:hover { filter: brightness(1.1); }

      .explore-badge { position: absolute; z-index: 5; left: 50%; top: 76px; transform: translateX(-50%); display: flex; align-items: center; gap: 9px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass-soft); backdrop-filter: blur(8px); color: #f3f3ed; font-size: 10px; white-space: nowrap; }
      .explore-badge button { border: 0; background: transparent; color: var(--lime); text-decoration: underline; text-underline-offset: 3px; font-size: 10px; }

      .event-panel { position: absolute; z-index: 5; left: 23px; bottom: 21px; width: min(390px, calc(100vw - 30px)); padding: 10px 12px 11px; border-left: 2px solid var(--lime); background: linear-gradient(90deg, rgba(16,26,19,.82), rgba(16,26,19,.38)); text-shadow: 0 1px 4px rgba(0,0,0,.55); }
      .event-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #c2d0c1; font-size: 9px; }
      .event-title { margin-top: 5px; font-size: 12px; font-weight: 650; }
      .event-copy { margin-top: 4px; color: #d0d7ce; font-size: 10px; line-height: 1.5; }
      .event-fork { margin-top: 8px; padding: 0; border: 0; background: transparent; color: var(--lime); font-size: 10px; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
      .bottom-hud { position: absolute; z-index: 5; right: 23px; bottom: 21px; display: flex; align-items: flex-end; gap: 10px; }
      .mode-switch { display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 7px; background: var(--glass); backdrop-filter: blur(10px); }
      .mode-switch button { min-height: 34px; padding: 0 11px; border: 0; border-radius: 4px; background: transparent; color: #d0d7d0; font-size: 10px; }
      .mode-switch button.active { background: rgba(212,238,125,.16); color: var(--lime); font-weight: 700; }
      .possibility-button { min-height: 42px; padding: 0 13px; border: 1px solid rgba(212,238,125,.68); border-radius: 6px; background: #d4ee7d; color: #27331e; font-size: 11px; font-weight: 750; box-shadow: 0 5px 18px rgba(0,0,0,.22); }
      .possibility-button:hover { background: #e0f691; }
      .toast { position: absolute; z-index: 12; left: 50%; top: 50%; transform: translate(-50%, 14px); opacity: 0; pointer-events: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass); backdrop-filter: blur(10px); color: white; font-size: 11px; transition: opacity .18s, transform .18s; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      dialog { width: min(480px, calc(100vw - 28px)); padding: 0; border: 1px solid rgba(236,242,232,.28); border-radius: 8px; background: #1c2921; color: var(--ink); box-shadow: 0 20px 70px rgba(0,0,0,.5); }
      dialog::backdrop { background: rgba(7,13,9,.64); backdrop-filter: blur(3px); }
      .fork-head { padding: 20px 21px 12px; }
      .fork-eyebrow { color: #b8c8b8; font-size: 9px; letter-spacing: .08em; }
      .fork-head h2 { margin: 7px 0 0; font-size: 17px; }
      .fork-copy { margin: 8px 21px 14px; color: #c8d1c7; font-size: 11px; line-height: 1.65; }
      .fork-form { padding: 0 21px 18px; }
      .fork-form label { display: block; margin-bottom: 6px; color: #e0e7dc; font-size: 10px; }
      .fork-form textarea { display: block; width: 100%; min-height: 82px; resize: vertical; border: 1px solid rgba(234,241,231,.22); border-radius: 5px; background: rgba(8,15,11,.45); color: white; padding: 10px; font: inherit; font-size: 11px; line-height: 1.55; outline: none; }
      .fork-form textarea:focus { border-color: var(--lime); }
      .fork-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
      .fork-actions button { min-height: 34px; padding: 0 12px; border: 1px solid rgba(240,245,236,.24); border-radius: 5px; background: transparent; color: #e7ebe4; font-size: 10px; }
      .fork-actions button.confirm { border-color: var(--lime); background: var(--lime); color: #27331e; font-weight: 750; }

      @media (max-width: 760px) {
        .top-hud { padding: 13px 13px; }
        .brand-block { gap: 8px; }
        .brand-mark { width: 30px; height: 30px; }
        .brand-name { font-size: 12px; }
        .world-name { font-size: 9px; }
        .world-clock { display: block; padding: 6px 8px; }
        .live-state { margin-top: 4px; font-size: 8px; }
        .clock-main { font-size: 10px; }
        .clock-date { font-size: 8px; }
        .top-tools { top: 70px; right: 11px; }
        .tool-button { width: 33px; height: 33px; font-size: 16px; }
        .place-marker { padding: 4px 6px; font-size: 9px; }
        .resident-sprite { width: 35px; height: 48px; }
        .resident-label { font-size: 8px; }
        .entity-panel { top: auto; right: 9px; bottom: 131px; left: 9px; width: auto; max-height: 42vh; padding: 13px; }
        .entity-main { margin-top: 10px; }
        .entity-activity { margin-top: 10px; }
        .entity-quote { margin-top: 8px; }
        .panel-actions { margin-top: 12px; }
        .explore-badge { top: 76px; max-width: calc(100vw - 80px); overflow: hidden; }
        .event-panel { left: 10px; bottom: 76px; width: min(350px, calc(100vw - 20px)); padding: 8px 10px; }
        .event-copy { max-width: 45ch; }
        .bottom-hud { left: 10px; right: 10px; bottom: 10px; justify-content: space-between; gap: 6px; }
        .mode-switch { gap: 1px; padding: 3px; }
        .mode-switch button { min-height: 32px; padding: 0 8px; font-size: 9px; }
        .possibility-button { min-height: 38px; padding: 0 10px; font-size: 10px; }
      }
      @media (max-width: 390px) {
        .top-hud { padding: 10px 9px; }
        .brand-name { font-size: 11px; }
        .world-clock { padding: 5px 6px; }
        .live-state { font-size: 7px; }
        .mode-switch button { padding: 0 6px; }
        .event-panel { bottom: 71px; }
        .bottom-hud { bottom: 8px; left: 8px; right: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="world" id="world" aria-label="雾岚庄园世界地图">
      <div class="art-layer" id="art-layer">
        <img class="world-art" src="../../web/public/scene-assets/mist-manor/concept-exterior.png" alt="从高处俯瞰薄雾中的雾岚庄园，庭院、温室、小桥与山林都清晰可见" />
        <div class="world-glint" aria-hidden="true"></div>
        <div class="map-markers" id="map-markers">
          <button class="map-marker place-marker" style="left:25%;top:61%" type="button" data-entity="greenhouse"><span class="place-glyph">⌂</span>温室</button>
          <button class="map-marker place-marker" style="left:60%;top:39%" type="button" data-entity="main-house"><span class="place-glyph">⌂</span>主宅</button>
          <button class="map-marker place-marker" style="left:45%;top:75%" type="button" data-entity="pond"><span class="place-glyph">⌁</span>庭院池塘</button>
          <button class="map-marker resident-marker" style="left:49%;top:53%" type="button" data-entity="lin" aria-label="查看居民林澄">
            <img class="resident-sprite" src="../../web/public/native2d/mist-manor/residents/resident-a.png" alt="" /><span class="resident-label">林澄 · 温室</span><i class="resident-pulse" aria-hidden="true"></i>
          </button>
          <button class="map-marker resident-marker" style="left:73%;top:61%" type="button" data-entity="gu" aria-label="查看居民顾远">
            <img class="resident-sprite" src="../../web/public/native2d/mist-manor/residents/resident-b.png" alt="" /><span class="resident-label">顾远 · 北廊</span>
          </button>
          <button class="map-marker resident-marker" style="left:35%;top:72%" type="button" data-entity="suzu" aria-label="查看居民千鹤">
            <img class="resident-sprite" src="../../web/public/native2d/mist-manor/residents/resident-c.png" alt="" /><span class="resident-label">千鹤 · 石桥</span>
          </button>
        </div>
      </div>
      <div class="world-shade" aria-hidden="true"></div>

      <header class="top-hud">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">P</div>
          <div><div class="brand-name">Possibility</div><div class="world-name">雾岚庄园 · 正在生活</div></div>
        </div>
        <div class="world-clock">
          <div><div class="clock-main">21:14</div><div class="clock-date">冬至前夜 · 1889</div></div>
          <div class="live-state"><i class="live-dot" aria-hidden="true"></i><span>世界继续运行</span></div>
        </div>
      </header>

      <div class="top-tools" aria-label="地图工具">
        <button class="tool-button" id="zoom-in" type="button" title="放大地图" aria-label="放大地图">＋</button>
        <button class="tool-button" id="zoom-out" type="button" title="缩小地图" aria-label="缩小地图">−</button>
        <button class="tool-button" id="reset-view" type="button" title="回到庄园全景" aria-label="回到庄园全景">⌖</button>
      </div>

      <div class="explore-badge" id="explore-badge" hidden><span id="explore-label">正在探索</span><button type="button" id="return-map">返回全景</button></div>

      <aside class="entity-panel" id="entity-panel" aria-live="polite" hidden>
        <div class="panel-top"><span class="panel-kicker" id="entity-kicker">庄园居民</span><button class="close-button" type="button" id="close-panel" aria-label="关闭详情">×</button></div>
        <div class="entity-main">
          <img class="entity-image" id="entity-image" src="" alt="" hidden />
          <div class="entity-glyph" id="entity-glyph" aria-hidden="true">⌂</div>
          <div><h2 id="entity-title"></h2><div class="entity-place" id="entity-place"></div></div>
        </div>
        <p class="entity-activity" id="entity-activity"></p>
        <p class="entity-quote" id="entity-quote"></p>
        <div class="panel-actions">
          <button class="panel-action primary" type="button" id="enter-entity">进入探索</button>
          <button class="panel-action" type="button" id="fork-entity">从此刻探索另一种可能</button>
        </div>
      </aside>

      <section class="event-panel" aria-label="最近发生的事">
        <div class="event-topline"><span>刚刚发生</span><span>21:14 · 温室</span></div>
        <div class="event-title">温室的灯灭了</div>
        <div class="event-copy">林澄还不知道，顾远把一封信留在了北廊。</div>
        <button class="event-fork" id="fork-event" type="button">从这一刻探索另一种可能 →</button>
      </section>

      <div class="bottom-hud">
        <div class="mode-switch" role="group" aria-label="世界视角">
          <button class="active" id="observe-mode" type="button" aria-pressed="true">观察</button>
          <button id="follow-mode" type="button" aria-pressed="false">跟随居民</button>
          <button id="life-mode" type="button" aria-pressed="false">居民生活</button>
        </div>
        <button class="possibility-button" id="open-fork" type="button">探索另一种可能</button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <dialog id="fork-dialog" aria-labelledby="fork-title">
      <div class="fork-head"><div class="fork-eyebrow" id="fork-context">雾岚庄园 · 冬至前夜 · 21:14</div><h2 id="fork-title">从这一刻，探索另一种可能</h2></div>
      <p class="fork-copy">共同的过去会保留下来。你可以改变一件事，看看庄园接下来会走向哪里。</p>
      <form class="fork-form" method="dialog">
        <label for="fork-prompt">如果……</label>
        <textarea id="fork-prompt">如果林澄先看见了顾远留在北廊的信？</textarea>
        <div class="fork-actions"><button type="button" id="cancel-fork">留在这个世界</button><button class="confirm" id="confirm-fork" type="button">创造平行世界</button></div>
      </form>
    </dialog>

    <script>
      const entities = {
        greenhouse: { type: '庄园地点', title: '温室', place: '庄园西侧 · 玻璃花房', activity: '夜里的暖气时断时续。还有几株冬苗留在靠窗的位置，灯刚刚熄灭。', quote: '窗边像是有一封信。', glyph: '⌂', x: 25, y: 61, fork: '如果温室的灯没有熄灭？' },
        'main-house': { type: '庄园地点', title: '主宅', place: '庄园中央 · 正门仍亮着灯', activity: '屋里很安静。二楼书房的窗还亮着，晚餐已经结束，几位居民各自回到了房间。', quote: '楼上传来纸页翻动的声音。', glyph: '⌂', x: 60, y: 39, fork: '如果今晚有人敲响了书房的门？' },
        pond: { type: '庄园地点', title: '庭院池塘', place: '主宅南侧 · 小桥与石灯', activity: '池面结了一层薄冰，桥边的石灯还亮着。有人沿池边走过，留下两串方向不同的脚印。', quote: '脚步声在桥的另一边停住了。', glyph: '⌁', x: 45, y: 75, fork: '如果两个人在桥上相遇？' },
        lin: { type: '庄园居民 · 园丁', title: '林澄', place: '此刻在温室 · 正照料冬苗', activity: '她刚发现靠窗的土壤冻硬了，正把最后几盆幼苗搬向暖房。她还没有看到顾远留下的信。', quote: '“灯再亮一会儿，应该就够了。”', image: '../../web/public/native2d/mist-manor/residents/resident-a.png', x: 49, y: 53, fork: '如果林澄先看见了顾远留在北廊的信？' },
        gu: { type: '庄园居民 · 修表匠', title: '顾远', place: '此刻在北廊 · 刚放下一封信', activity: '他在门边停了一会儿，最终还是没有敲门。信上没有署名，纸角沾了一点温室的泥土。', quote: '“如果她问起，就说我明早再来。”', image: '../../web/public/native2d/mist-manor/residents/resident-b.png', x: 73, y: 61, fork: '如果顾远今晚敲响了温室的门？' },
        suzu: { type: '庄园居民 · 学徒', title: '千鹤', place: '此刻在石桥边 · 正准备回家', activity: '她刚从后山散步回来，口袋里装着一张在路上捡到的旧纸片。她还不知道那是谁的字迹。', quote: '“我好像在哪儿见过这个名字。”', image: '../../web/public/native2d/mist-manor/residents/resident-c.png', x: 35, y: 72, fork: '如果千鹤把纸片带回了镇上？' }
      };

      const world = document.querySelector('#world');
      const artLayer = document.querySelector('#art-layer');
      const panel = document.querySelector('#entity-panel');
      const forkDialog = document.querySelector('#fork-dialog');
      const toast = document.querySelector('#toast');
      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let focusedKey = null;
      let toastTimer;

      function setCamera() {
        artLayer.style.setProperty('--zoom', String(zoom));
        artLayer.style.setProperty('--pan-x', panX + 'px');
        artLayer.style.setProperty('--pan-y', panY + 'px');
      }

      function centerOn(key, nextZoom) {
        const entity = entities[key];
        if (!entity) return;
        zoom = nextZoom;
        panX = world.clientWidth * .5 - world.clientWidth * entity.x / 100 * zoom;
        panY = world.clientHeight * .5 - world.clientHeight * entity.y / 100 * zoom;
        setCamera();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
      }

      function setMode(mode) {
        const selectedId = mode === 'observe' ? 'observe-mode' : mode === 'follow' ? 'follow-mode' : 'life-mode';
        document.querySelectorAll('.mode-switch button').forEach(function (button) {
          const selected = button.id === selectedId;
          button.classList.toggle('active', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
        if (mode === 'observe') {
          document.querySelector('#explore-badge').hidden = true;
          document.querySelectorAll('.resident-marker').forEach(function (marker) { marker.hidden = false; });
          zoom = 1; panX = 0; panY = 0; setCamera();
          return;
        }
        if (mode === 'follow') {
          if (!focusedKey || !entities[focusedKey].image) {
            focusedKey = 'lin';
            openEntity('lin');
          }
          enterFocused();
          return;
        }
        document.querySelectorAll('.resident-marker').forEach(function (marker) { marker.hidden = false; });
        showToast('居民仍在继续生活。选择一位居民，看看他此刻在做什么。');
      }

      function openEntity(key) {
        const entity = entities[key];
        if (!entity) return;
        focusedKey = key;
        document.querySelectorAll('[data-entity]').forEach(function (marker) {
          marker.classList.toggle('selected', marker.dataset.entity === key);
        });
        document.querySelector('#entity-kicker').textContent = entity.type;
        document.querySelector('#entity-title').textContent = entity.title;
        document.querySelector('#entity-place').textContent = entity.place;
        document.querySelector('#entity-activity').textContent = entity.activity;
        document.querySelector('#entity-quote').textContent = entity.quote;
        document.querySelector('#entity-glyph').textContent = entity.glyph || '⌂';
        const image = document.querySelector('#entity-image');
        image.hidden = !entity.image;
        image.src = entity.image || '';
        document.querySelector('#entity-glyph').hidden = Boolean(entity.image);
        document.querySelector('#enter-entity').textContent = entity.image ? '跟随这位居民' : '进入这个地点';
        document.querySelector('#fork-prompt').value = entity.fork;
        panel.hidden = false;
      }

      function enterFocused() {
        const entity = entities[focusedKey];
        if (!entity) return;
        panel.hidden = true;
        document.querySelector('#explore-label').textContent = entity.image ? '正在跟随 ' + entity.title + ' · ' + entity.place.split(' · ')[0] : '正在探索 ' + entity.title;
        document.querySelector('#explore-badge').hidden = false;
        document.querySelectorAll('.resident-marker').forEach(function (marker) {
          marker.hidden = marker.dataset.entity !== focusedKey;
        });
        document.querySelectorAll('.mode-switch button').forEach(function (button) {
          const selected = button.id === 'follow-mode';
          button.classList.toggle('active', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
        centerOn(focusedKey, 1.62);
      }

      function openFork(context, prompt) {
        document.querySelector('#fork-context').textContent = context || '雾岚庄园 · 冬至前夜 · 21:14';
        if (prompt) document.querySelector('#fork-prompt').value = prompt;
        forkDialog.showModal();
      }

      document.querySelectorAll('[data-entity]').forEach(function (marker) {
        marker.addEventListener('click', function () { openEntity(marker.dataset.entity); });
      });
      document.querySelector('#close-panel').addEventListener('click', function () {
        panel.hidden = true;
        document.querySelectorAll('[data-entity]').forEach(function (marker) { marker.classList.remove('selected'); });
      });
      document.querySelector('#enter-entity').addEventListener('click', enterFocused);
      document.querySelector('#fork-entity').addEventListener('click', function () {
        const entity = entities[focusedKey];
        openFork(entity.title + ' · 冬至前夜 · 21:14', entity.fork);
      });
      document.querySelector('#fork-event').addEventListener('click', function () {
        openFork('温室的灯灭了 · 冬至前夜 · 21:14', '如果林澄先看见了顾远留在北廊的信？');
      });
      document.querySelector('#open-fork').addEventListener('click', function () {
        const entity = focusedKey ? entities[focusedKey] : null;
        openFork(entity ? entity.title + ' · 冬至前夜 · 21:14' : '雾岚庄园 · 冬至前夜 · 21:14', entity ? entity.fork : null);
      });
      document.querySelector('#cancel-fork').addEventListener('click', function () { forkDialog.close(); });
      document.querySelector('#confirm-fork').addEventListener('click', function () {
        const prompt = document.querySelector('#fork-prompt').value.trim();
        if (!prompt) { document.querySelector('#fork-prompt').focus(); return; }
        forkDialog.close();
        showToast('已从共同的过去建立一条新可能。');
      });
      document.querySelector('#return-map').addEventListener('click', function () {
        setMode('observe');
        panel.hidden = false;
      });
      document.querySelector('#observe-mode').addEventListener('click', function () { setMode('observe'); });
      document.querySelector('#follow-mode').addEventListener('click', function () { setMode('follow'); });
      document.querySelector('#life-mode').addEventListener('click', function () {
        setMode('life');
        panel.hidden = false;
        if (focusedKey) openEntity(focusedKey);
      });
      document.querySelector('#zoom-in').addEventListener('click', function () { zoomAroundCenter(zoom + .15); });
      document.querySelector('#zoom-out').addEventListener('click', function () { zoomAroundCenter(zoom - .15); });
      document.querySelector('#reset-view').addEventListener('click', function () { setMode('observe'); panel.hidden = true; });

      function zoomAroundCenter(nextZoom) {
        const clamped = Math.max(1, Math.min(2.1, nextZoom));
        const delta = clamped - zoom;
        panX -= world.clientWidth * .5 * delta;
        panY -= world.clientHeight * .5 * delta;
        zoom = clamped;
        setCamera();
      }

      let dragStart = null;
      artLayer.addEventListener('pointerdown', function (event) {
        if (event.target.closest('button')) return;
        dragStart = { x: event.clientX, y: event.clientY, panX: panX, panY: panY };
        artLayer.classList.add('dragging');
        artLayer.setPointerCapture(event.pointerId);
      });
      artLayer.addEventListener('pointermove', function (event) {
        if (!dragStart) return;
        panX = dragStart.panX + event.clientX - dragStart.x;
        panY = dragStart.panY + event.clientY - dragStart.y;
        setCamera();
      });
      function endDrag() { dragStart = null; artLayer.classList.remove('dragging'); }
      artLayer.addEventListener('pointerup', endDrag);
      artLayer.addEventListener('pointercancel', endDrag);
      world.addEventListener('wheel', function (event) {
        if (event.target.closest('button, aside, dialog')) return;
        event.preventDefault();
        zoomAroundCenter(zoom + (event.deltaY < 0 ? .08 : -.08));
      }, { passive: false });
      window.addEventListener('resize', function () { if (zoom > 1 && focusedKey) centerOn(focusedKey, zoom); });
    </script>
  </body>
</html>
