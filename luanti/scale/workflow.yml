# Copy to .github/workflows/luanti-scale.yml to enable workflow_dispatch.
name: Luanti capacity ladder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 luanti-server
      - name: Check engine and game availability
        run: |
          /usr/libexec/luanti/luantiserver --version
          dpkg-query -W luanti-server luanti-game-minetest
      - uses: actions/checkout@v4
      - name: Run sequential ladder
        run: python3 luanti/scale/run.py --binary /usr/libexec/luanti/luantiserver --output "$GITHUB_WORKSPACE/scale-results"
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/scale-results/summary.md" ]; then
            cat "$GITHUB_WORKSPACE/scale-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luanti-capacity-results
          path: scale-results/
          if-no-files-found: warn
          retention-days: 14
