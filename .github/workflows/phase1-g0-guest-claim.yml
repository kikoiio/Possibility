name: Phase 1 G0 guest claim journey (cloud)

on:
  workflow_dispatch:
    inputs:
      run_provider_acceptance:
        description: Run isolated DeepSeek acceptance within the configured remaining budget
        type: boolean
        required: true
        default: false
      provider_request_cap:
        description: Remaining authorized requests (integer from 1 to 25)
        type: number
        required: true
        default: 25
      provider_scenarios:
        description: Comma-separated cases; full suite includes original-world-repair
        type: string
        required: true
        default: official-example,custom-1,custom-2,custom-3,original-world-repair
      visual_provider_run_id:
        description: Optional completed provider run to render; no model calls in this mode
        type: string
        required: false
        default: ''
      replay_provider_run_id:
        description: Recorded provider run ID or comma-separated successful source runs; zero model calls
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: phase1-g0-${{ inputs.visual_provider_run_id != '' && 'visual' || inputs.replay_provider_run_id != '' && 'replay' || inputs.run_provider_acceptance && 'provider' || 'guest-claim' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voxel-validation:
    if: inputs.visual_provider_run_id == ''
    name: Voxel generation and draft regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify terrain footprint boundaries
        run: npm --workspace @possibility/voxel-contract test -- --maxWorkers=1 tests/terrain.test.ts tests/assets.test.ts tests/two-story-house.test.ts
      - name: Check API types including acceptance harness
        run: npm --workspace api run build
      - name: Verify generation and draft contracts without provider calls
        run: npm --workspace api test -- --pool=forks --maxWorkers=1 --no-file-parallelism scripts/merge-phase1-provider-archives.test.ts src/voxel/edit-planner.test.ts src/voxel/normalize.test.ts src/voxel/normalize-limit.test.ts src/voxel/generate.test.ts src/scenes/voxel-draft.test.ts src/scenes/routes.test.ts src/db/scene-compatibility-migration.test.ts src/native2d/repository.test.ts src/native2d/routes.test.ts src/demo/clone-verification.test.ts src/scenes/compatibility/clone-semantics.test.ts

  guest-claim:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.run_provider_acceptance && inputs.visual_provider_run_id == '' && inputs.replay_provider_run_id == '')
    name: Isolated real API + browser guest claim slice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npm --workspace web exec -- playwright install --with-deps chromium
      - name: Run isolated guest and public-read API acceptance slices
        working-directory: api
        run: |
          set -o pipefail
          {
            echo "api_acceptance_files=src/test/s03-guest-participation.test.ts,src/map/bootstrap.test.ts,src/public/routes.test.ts,src/access/policy.test.ts,src/worlds/create-voxel.test.ts,src/scenes/routes.test.ts"
            npm test -- --pool=forks --maxWorkers=1 --no-file-parallelism src/test/s03-guest-participation.test.ts src/map/bootstrap.test.ts src/public/routes.test.ts src/access/policy.test.ts src/worlds/create-voxel.test.ts src/scenes/routes.test.ts
          } 2>&1 | tee "$RUNNER_TEMP/phase1-guest-claim.log"
      - name: Run isolated guest fork and claim journey
        working-directory: web
        env:
          PLAYWRIGHT_API_PORT: 28787
          PLAYWRIGHT_WEB_PORT: 26173
          PLAYWRIGHT_API_DATA_MODE: standard-life-fixture
          CI: true
        run: |
          set -o pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "journey_revision=16"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "scope=guest dialogue, fork, account claim, owner pause/resume, scene edit persistence, real split comparison, reload continuation; deterministic single-space create and original-world repair UI/save recovery"
            echo "e2e_files=e2e/guest-claim-journey.spec.ts,e2e/scene-create.spec.ts,e2e/scene-repair.spec.ts,e2e/voxel-asset-editing.spec.ts"
            echo "excluded=real model generation; create/repair UI draft responses are route fixtures, API save contracts use valid fixed voxel documents"
            npm run test:e2e -- --workers=1 --project=desktop-chromium e2e/guest-claim-journey.spec.ts e2e/scene-create.spec.ts e2e/scene-repair.spec.ts e2e/voxel-asset-editing.spec.ts
          } 2>&1 | tee -a "$RUNNER_TEMP/phase1-guest-claim.log"
      - name: Upload browser trace and run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-g0-guest-claim-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/phase1-guest-claim.log
            /tmp/s02-playwright-results/
          retention-days: 14

  phase1-g0-provider:
    needs: voxel-validation
    if: always() && needs['voxel-validation'].result == 'success' && github.event_name == 'workflow_dispatch' && inputs.visual_provider_run_id == '' && (inputs.run_provider_acceptance || inputs.replay_provider_run_id != '') && github.ref == 'refs/heads/main'
    name: Isolated Phase 1 provider acceptance or recorded replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase1-g0-provider-acceptance
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate recorded replay identifier
        if: inputs.replay_provider_run_id != ''
        env:
          REPLAY_RUN_ID: ${{ inputs.replay_provider_run_id }}
        run: '[[ "$REPLAY_RUN_ID" =~ ^[0-9]+(,[0-9]+)*$ ]]'
      - name: Download recorded source runs
        if: inputs.replay_provider_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPLAY_RUN_IDS: ${{ inputs.replay_provider_run_id }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a source_runs <<< "$REPLAY_RUN_IDS"
          for source_run in "${source_runs[@]}"; do
            gh run download "$source_run" --name "phase1-g0-provider-acceptance-$source_run" \
              --dir "$RUNNER_TEMP/provider-replay/$source_run"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare recorded regression input with source provenance
        if: inputs.replay_provider_run_id != ''
        env:
          REPLAY_RUN_IDS: ${{ inputs.replay_provider_run_id }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a source_runs <<< "$REPLAY_RUN_IDS"
          archives=()
          for source_run in "${source_runs[@]}"; do
            archives+=("$RUNNER_TEMP/provider-replay/$source_run/phase1-g0-provider-$source_run.json")
          done
          if (( ${#archives[@]} == 1 )); then
            cp "${archives[0]}" "$RUNNER_TEMP/provider-replay/composite.json"
          else
            npx tsx api/scripts/merge-phase1-provider-archives.ts \
              "$RUNNER_TEMP/provider-replay/composite.json" "${archives[@]}"
          fi
      - name: Diagnose archived construction responses without model calls
        if: inputs.replay_provider_run_id != ''
        env:
          G0_EVIDENCE_FILE: ${{ runner.temp }}/provider-replay/composite.json
        run: npx tsx api/scripts/phase1-generation-replay-diagnostics.ts
      - name: Upload construction replay diagnostics
        if: always() && inputs.replay_provider_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase1-generation-replay-diagnostics-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/phase1-generation-replay-diagnostics.json
      - name: Run selected isolated provider acceptance
        working-directory: api
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          G0_PROVIDER_REQUEST_CAP: ${{ inputs.provider_request_cap }}
          G0_PROVIDER_SCENARIOS: ${{ inputs.provider_scenarios }}
          G0_PROVIDER_REPLAY_FILE: ${{ inputs.replay_provider_run_id != '' && format('{0}/provider-replay/composite.json', runner.temp) || '' }}
          G0_REPLAY_REQUEST_CAP: 25
          G0_D1_PATH: ${{ runner.temp }}/phase1-g0-provider-${{ github.run_id }}.sqlite
          G0_EVIDENCE_FILE: ${{ runner.temp }}/phase1-g0-provider-${{ github.run_id }}.json
        run: npm test -- --pool=forks --maxWorkers=1 --no-file-parallelism src/test/phase1-g0-provider.acceptance.test.ts
      - name: Upload redacted provider acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-g0-provider-acceptance-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/phase1-g0-provider-${{ github.run_id }}.json
          retention-days: 14

  generated-preview:
    if: github.event_name == 'workflow_dispatch' && !inputs.run_provider_acceptance && inputs.visual_provider_run_id != ''
    name: Render exact generated documents for semantic review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PHASE1_PREVIEW_URL: http://127.0.0.1:15176
    steps:
      - uses: actions/checkout@v4
      - name: Validate source run identifier
        env:
          PROVIDER_RUN_ID: ${{ inputs.visual_provider_run_id }}
        run: '[[ "$PROVIDER_RUN_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.visual_provider_run_id }}
          name: phase1-g0-provider-acceptance-${{ inputs.visual_provider_run_id }}
          path: ${{ runner.temp }}/provider-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace web run build
      - run: npm --workspace web exec -- playwright install --with-deps chromium
      - name: Serve production preview
        shell: bash
        run: |
          setsid npm --workspace web run preview -- --host 127.0.0.1 --port 15176 > "$RUNNER_TEMP/phase1-generated-preview-server.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/phase1-generated-preview.pgid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$PHASE1_PREVIEW_URL/worlds/new" > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Render generated drafts without calling the provider
        working-directory: web
        env:
          G0_EVIDENCE_FILE: ${{ runner.temp }}/provider-evidence/phase1-g0-provider-${{ inputs.visual_provider_run_id }}.json
        run: npx tsx scripts/phase1-generated-preview.acceptance.ts
      - name: Upload generated scene review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-generated-preview-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/phase1-generated-preview.json
            ${{ runner.temp }}/phase1-generated-*.png
            ${{ runner.temp }}/phase1-generated-preview-server.log
      - name: Stop production preview
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/phase1-generated-preview.pgid" ]]; then
            kill -TERM -- "-$(cat "$RUNNER_TEMP/phase1-generated-preview.pgid")" 2>/dev/null || true
          fi
