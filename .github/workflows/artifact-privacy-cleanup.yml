name: Remove exposed synthetic private-data artifacts
on:
  push:
    branches: [ ops/wispiva-privacy-artifact-cleanup-20261030 ]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Remove historical product-model logs and raw CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          cjk_runs='[41069246124,41072461877,41075436293,41076669398,41080849574,41083814007]'
          model_runs='[41008153510,41010708756,41025066379,41037865211,41058674691]'
          for run_id in $(printf '%s' "$model_runs" | jq -r '.[]'); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${auth[@]}" "$GH_API/repos/$GH_REPOSITORY/actions/runs/$run_id/logs")
            case "$code" in 204|404|410) ;; *) echo "Could not remove run logs $run_id: HTTP $code" >&2; exit 1 ;; esac
          done

          : > raw-artifact-ids.txt
          for page in $(seq 1 20); do
            response=$(curl -fsS "${auth[@]}" "$GH_API/repos/$GH_REPOSITORY/actions/artifacts?per_page=100&page=$page")
            printf '%s' "$response" | jq -r --argjson cjk "$cjk_runs" --argjson model "$model_runs" '
              .artifacts[]
              | select(
                  ((.workflow_run.id as $id | ($cjk | index($id)) != null) and .name == "wispiva-results-0")
                  or
                  ((.workflow_run.id as $id | ($model | index($id)) != null)
                    and (.name == "wispiva-results-0" or .name == "wispiva-product-model-evidence"
                         or .name == "wispiva-product-model-worker-evidence"))
                )
              | .id' >> raw-artifact-ids.txt
            count=$(printf '%s' "$response" | jq '.artifacts | length')
            [ "$count" -lt 100 ] && break
          done
          sort -u -o raw-artifact-ids.txt raw-artifact-ids.txt
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${auth[@]}" "$GH_API/repos/$GH_REPOSITORY/actions/artifacts/$artifact_id")
            case "$code" in 204|404|410) ;; *) echo "Could not remove artifact $artifact_id: HTTP $code" >&2; exit 1 ;; esac
          done < raw-artifact-ids.txt
          echo "Removed raw historical artifacts: $(wc -l < raw-artifact-ids.txt)"
          for page in $(seq 1 20); do
            response=$(curl -fsS "${auth[@]}" "$GH_API/repos/$GH_REPOSITORY/actions/artifacts?per_page=100&page=$page")
            remaining=$(printf '%s' "$response" | jq -r --argjson cjk "$cjk_runs" --argjson model "$model_runs" '
              [.artifacts[] | select(
                ((.workflow_run.id as $id | ($cjk | index($id)) != null) and .name == "wispiva-results-0")
                or
                ((.workflow_run.id as $id | ($model | index($id)) != null)
                  and (.name == "wispiva-results-0" or .name == "wispiva-product-model-evidence"
                       or .name == "wispiva-product-model-worker-evidence"))
              )] | length')
            [ "$remaining" -eq 0 ] || { echo "Historical raw artifacts remain on page $page" >&2; exit 1; }
            count=$(printf '%s' "$response" | jq '.artifacts | length')
            [ "$count" -lt 100 ] && break
          done
          echo "Artifact inventory verified clean."
