name: Scene repair profile

on:
  push:
    branches: ['codex/code-quality-2026-10']

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Record runner resources
        run: |
          free -h
          vmstat 1 5
          cat /proc/pressure/memory
      - name: Install locked dependencies
        run: npm ci
      - name: Profile original scene repair
        working-directory: api
        env:
          A1_RESOURCE_EVIDENCE_PATH: ${{ runner.temp }}/repair-profile/metrics.json
          NODE_OPTIONS: --cpu-prof --cpu-prof-interval=10000 --cpu-prof-dir=${{ runner.temp }}/repair-profile
        run: |
          mkdir -p "$RUNNER_TEMP/repair-profile"
          npm test -- --pool=forks --maxWorkers=1 --no-file-parallelism src/demo/original-sample-diagnostics.test.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scene-repair-profile-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/repair-profile/
          retention-days: 7
