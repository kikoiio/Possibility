name: Phase 3 presentation browser acceptance

on:
  push:
    branches: [phase3]
    paths:
      - .github/workflows/phase3-presentation-acceptance.yml
      - web/e2e/presentation-*.spec.ts
      - web/e2e/split-view-stubs.ts
      - web/src/components/world/presentation/**
      - web/src/native2d/**
      - web/src/pages/WorldCanvasPage.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation-browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npm --workspace web exec -- playwright install --with-deps chromium
      - name: Record runner resources before browser work
        run: |
          free -h
          vmstat 1 5
          cat /proc/pressure/memory
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
      - name: Run isolated presentation browser journeys
        working-directory: web
        env:
          PLAYWRIGHT_API_PORT: 28787
          PLAYWRIGHT_WEB_PORT: 26173
          PLAYWRIGHT_API_DATA_MODE: standard-life-fixture
          CI: true
        run: npm run test:e2e -- --workers=1 --project=desktop-chromium e2e/presentation-switch.spec.ts e2e/presentation-cross-world.spec.ts e2e/presentation-same-world.spec.ts e2e/presentation-performance.spec.ts
      - name: Run touch presentation journey
        working-directory: web
        env:
          PLAYWRIGHT_API_PORT: 28787
          PLAYWRIGHT_WEB_PORT: 26173
          PLAYWRIGHT_API_DATA_MODE: standard-life-fixture
          CI: true
        run: npm run test:e2e -- --workers=1 --project=mobile-chromium e2e/presentation-responsive.mobile.spec.ts
      - name: Upload browser traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-presentation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: /tmp/s02-playwright-results/
