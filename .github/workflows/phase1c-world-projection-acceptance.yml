name: Phase 1C world projection acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1c-world-projection-${{ github.ref }}
  cancel-in-progress: false

env:
  PHASE1C_ROOT: ${{ github.workspace }}/.tmp/phase1c/${{ github.run_id }}
  PHASE1C_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/phase1c-world-projection/${{ github.run_id }}

jobs:
  focused:
    name: Focused phase1C contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Runner resources
        run: |
          free -h
          vmstat 1 5
          cat /proc/pressure/memory
          df -h /tmp .
      - name: Install dependencies
        run: npm ci
      - name: Run focused presentation contracts
        run: |
          npm --workspace web test -- --maxWorkers=1 --no-file-parallelism \
            src/components/world/presentation \
            src/lib/presentation-state.test.ts \
            src/native2d/__tests__/voxel-scene-projection.test.ts
          npm --workspace api test -- --maxWorkers=1 --no-file-parallelism src/map/bootstrap.test.ts
      - name: Validate evidence manifest tooling
        run: |
          npm exec -- tsx web/scripts/phase1c-world-projection.acceptance.ts --validate-manifest
          node --test scripts/finalize-phase1c-world-projection-acceptance.test.mjs
      - name: Cleanup focused resources
        if: always()
        run: |
          mkdir -p "$PHASE1C_ROOT"
          test ! -e "$PHASE1C_ROOT/active.pid"

  regression:
    name: API and Web regression
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API regression
        run: npm --workspace api test -- --maxWorkers=1 --no-file-parallelism --exclude src/test/phase1-g0-provider.acceptance.test.ts
      - name: Web regression
        run: npm --workspace web test -- --maxWorkers=1 --no-file-parallelism

  build:
    name: API and Web builds
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build API
        run: npm --workspace api run build
      - name: Build Web
        run: npm --workspace web run build

  browser:
    name: Isolated projection browser journeys
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npm --workspace web exec -- playwright install --with-deps chromium
      - name: Run phase 1C projection journeys
        working-directory: web
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/phase1c/${{ github.run_id }}
          PHASE1C_EVIDENCE_MANIFEST: ${{ github.workspace }}/artifacts/phase1c-world-projection/${{ github.run_id }}/manifest.json
        run: npm run test:e2e -- --config playwright.phase1c-projection.config.ts --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-world-projection-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/phase1c-world-projection/${{ github.run_id }}/
          retention-days: 14

  finalize:
    name: Finalize redacted evidence
    if: always()
    needs: [focused, regression, build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download approved evidence only
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase1c-world-projection-evidence-*
          path: artifacts/phase1c-world-projection/${{ github.run_id }}
          merge-multiple: true
      - name: Finalize and verify cleanup
        env:
          PHASE1C_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/phase1c-world-projection/${{ github.run_id }}
        run: |
          node scripts/finalize-phase1c-world-projection-acceptance.mjs
          test ! -e "$PHASE1C_ROOT/active.pid"
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-world-projection-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/phase1c-world-projection/${{ github.run_id }}/
          retention-days: 14
