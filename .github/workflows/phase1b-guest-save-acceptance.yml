name: Phase 1B guest save acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1b-guest-save-${{ github.ref }}
  cancel-in-progress: false

env:
  PHASE1B_ROOT: ${{ github.workspace }}/.tmp/phase1b/${{ github.run_id }}
  PHASE1B_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/phase1b-guest-save/${{ github.run_id }}

jobs:
  focused:
    name: Focused phase1B contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Runner resources
        run: |
          free -h
          vmstat 1 5
          cat /proc/pressure/memory
          df -h /tmp .
      - name: Install dependencies
        run: npm ci
      - name: Run focused API and Web contracts
        run: |
          npm --workspace api test -- --maxWorkers=1 --no-file-parallelism src/demo/claim-repository.test.ts src/demo/claim-status.test.ts src/demo/claim-publication.test.ts src/demo/routes.test.ts src/demo/session-service.test.ts
          npm --workspace web test -- --maxWorkers=1 --no-file-parallelism src/guest/claim-store.test.ts src/guest/claim-flow.test.ts src/components/guest/GuestClaimStatusPanel.test.tsx src/api/client.test.ts
      - name: Validate evidence manifest tooling
        run: |
          npm exec -- tsx web/scripts/phase1b-guest-save.acceptance.ts --validate-manifest
          node --test scripts/finalize-phase1b-guest-save-acceptance.test.mjs
      - name: Cleanup focused resources
        if: always()
        run: |
          mkdir -p "$PHASE1B_ROOT"
          test ! -e "$PHASE1B_ROOT/active.pid"

  regression:
    name: API and Web regression
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API regression
        run: npm --workspace api test -- --maxWorkers=1 --no-file-parallelism --exclude src/test/phase1-g0-provider.acceptance.test.ts
      - name: Web regression
        run: npm --workspace web test -- --maxWorkers=1 --no-file-parallelism

  build:
    name: API and Web builds
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build API
        run: npm --workspace api run build
      - name: Build Web
        run: npm --workspace web run build

  browser:
    name: Isolated three viewport browser journeys
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npm --workspace web exec -- playwright install --with-deps chromium
      - name: Run guest save journeys
        working-directory: web
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/phase1b/${{ github.run_id }}
        run: npm run test:e2e -- --config playwright.guest-claim.config.ts --workers=1
      - name: Write redacted evidence manifest
        if: always()
        working-directory: web
        env:
          PHASE1B_EVIDENCE_MANIFEST: ${{ github.workspace }}/artifacts/phase1b-guest-save/${{ github.run_id }}/manifest.json
        run: npm exec -- tsx scripts/phase1b-guest-save.acceptance.ts --write-manifest
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-guest-save-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: artifacts/phase1b-guest-save/${{ github.run_id }}/
          retention-days: 14

  finalize:
    name: Finalize redacted evidence
    if: always()
    needs: [focused, regression, build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download approved evidence only
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase1b-guest-save-evidence-*
          path: artifacts/phase1b-guest-save/${{ github.run_id }}
          merge-multiple: true
      - name: Finalize and verify cleanup
        env:
          PHASE1B_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/phase1b-guest-save/${{ github.run_id }}
        run: |
          node scripts/finalize-phase1b-guest-save-acceptance.mjs
          test ! -e "$PHASE1B_ROOT/active.pid"
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-guest-save-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/phase1b-guest-save/${{ github.run_id }}/
          retention-days: 14
