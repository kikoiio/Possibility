name: Live LLM memory A/B

on:
  workflow_dispatch:
    inputs:
      beats:
        description: Beats per memory strategy
        required: true
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  live-memory-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -p packages/engine/tsconfig.json --noEmit
      - name: Run live memory experiment
        env:
          GROQ_LLM_API_KEY: ${{ secrets.GROQ_LLM_API_KEY }}
          AB_MEMORY_BEATS: ${{ inputs.beats }}
        run: |
          set -o pipefail
          test -n "$GROQ_LLM_API_KEY"
          node --experimental-strip-types --experimental-transform-types scripts/ab-memory.mjs | tee ab-memory-report.json
      - name: Echo LLM usage
        run: node -e "const { usage } = JSON.parse(require('node:fs').readFileSync('ab-memory-report.json', 'utf8')); console.log('LLM usage:', JSON.stringify(usage))"
