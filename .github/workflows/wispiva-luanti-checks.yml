name: Wispiva Luanti checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n engine/luanti/runtime/bootstrap.sh
          bash -n engine/luanti/run.sh
          bash -n validation/luanti/bench/run.sh
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          luac5.1 -p engine/luanti/mod/society/init.lua
          luac5.1 -p engine/luanti/mod/society/policy.lua
          luac5.1 -p validation/luanti/bench/init.lua
