name: Prototype observations

on:
  workflow_dispatch:
    inputs:
      live_groq:
        description: 'Use GROQ_API_KEY for up to six real Groq requests'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare scratch directory
        run: mkdir -p .tmp/browser prototype/v2/artifacts
      - name: Observe clock, branches, memory and restart
        run: npm run prototype:observe
      - name: Prepare browser tooling on the cloud runner
        run: |
          npm install --prefix .tmp/browser --no-audit --no-fund playwright-core
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Observe desktop, mobile, editor and real WebGL
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node prototype/v2/browser-observe.mjs
      - name: Observe real Groq candidates and branch continuation
        if: ${{ inputs.live_groq }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_LLM_API_KEY || secrets.GROQ_API_KEY }}
        run: node prototype/v2/live-groq.mjs
      - name: Save observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-observations
          path: |
            prototype/v2/artifacts/*.json
            prototype/v2/artifacts/*.png
          retention-days: 7
