name: Wispiva Luanti validation
on:
  push:
    branches: [ 'wispiva/world-product', 'validation/luanti-*' ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ (startsWith(github.ref_name, 'validation/luanti-memory-') || startsWith(github.ref_name, 'validation/luanti-budget-')) && 'wispiva-model-validation' || 'wispiva-validation' }}
  cancel-in-progress: false
jobs:
  validation:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        count: ${{ startsWith(github.ref_name, 'validation/luanti-opt-') && fromJSON('[1000,5000,10000]') || fromJSON('[0]') }}
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    steps:
      - name: Install runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git procps python3 lua5.1 luanti luanti-server luanti-game-minetest xvfb
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          set -o pipefail
          {
            (
              cd cognition
              lua5.1 test.lua
              lua5.1 test_persistence.lua
              lua5.1 test_resource_actions.lua
              lua5.1 test_action_context.lua
              lua5.1 test_spatial.lua
              lua5.1 test_runtime.lua
              lua5.1 test_retrieval.lua
              lua5.1 test_long_term_memory.lua
              lua5.1 test_long_term_integration.lua
              lua5.1 test_reflection_apply.lua
              lua5.1 test_reflection_runtime.lua
              lua5.1 test_logical_clock.lua
              lua5.1 test_product_state.lua
              lua5.1 test_world_events.lua
              lua5.1 test_environment.lua
              lua5.1 test_model_envelope.lua
              lua5.1 test_navigation.lua
            )
          lua5.1 engine/luanti/mod/society/test_world_projection.lua
          python3 -B -m unittest discover -s model -t . -p 'test_*.py' -v
          python3 -B -m unittest -v engine/luanti/test_control.py
          python3 -B -m unittest -v validation/test_model_load.py validation/test_product_memory_audit.py
          python3 -B -m unittest -v engine/luanti/test_snapshot.py
          python3 -B -m unittest -v engine/luanti/test_recovery_journal.py engine/luanti/test_world_identity.py engine/luanti/test_world_lock.py engine/luanti/test_world_session.py engine/luanti/test_launch.py
          python3 -B -m unittest discover -s validation/luanti/scale -t . -p 'test_*.py' -v
          python3 -B -m unittest discover -s validation/luanti/analysis -t . -p 'test_*.py' -v
          python3 -B -m unittest discover -s genesis -t . -p 'test_*.py' -v
          python3 -B -m unittest discover -s world -t . -p 'test_*.py' -v
          } 2>&1 | tee unit-tests.log
      - name: Prepare runtime
        run: |
          uptime
          nproc
          free -h
          cat /proc/pressure/memory
          rt="$GITHUB_WORKSPACE/engine/luanti/.runtime"
          mkdir -p "$rt/root/usr/libexec/luanti" "$rt/root/usr/lib/x86_64-linux-gnu" "$rt/home/.luanti/games"
          ln -s /usr/libexec/luanti/luantiserver "$rt/root/usr/libexec/luanti/luantiserver"
          test -x /usr/games/luanti
          ln -s /usr/games/luanti "$rt/root/usr/libexec/luanti/luanti"
          cp -a /usr/share/luanti/games/minetest_game "$rt/home/.luanti/games/"
          mkdir -p "$rt/home/.minetest"
          ln -s ../.luanti/games "$rt/home/.minetest/games"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          Path('run-metadata.json').write_text(json.dumps({
              'git_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'platform': platform.platform(), 'cpu_count': os.cpu_count(),
              'engine_package': subprocess.check_output(['dpkg-query', '-W', 'luanti-server'], text=True).strip(),
              'mem_total': next(line.strip() for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:')),
              'cgroup_memory': {str(path): path.read_text().strip() for path in
                  (Path('/sys/fs/cgroup/memory.max'), Path('/sys/fs/cgroup/memory.current'),
                   Path('/sys/fs/cgroup/memory/memory.limit_in_bytes')) if path.exists()},
          }, indent=2) + '\n')
          PY
      - name: Run agent loop with cognition
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          engine/luanti/run.sh --label ci-cognition --agents 5 --decisions 8 --interval 1 --set society_cognition=true
      - name: Copy and reset world
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          exp=engine/luanti
          python3 "$exp/snapshot.py" "$exp/worlds/ci-cognition.run1" "$exp/worlds/ci-reset.run1"
          python3 "$exp/snapshot.py" "$exp/worlds/ci-cognition.run1" "$exp/worlds/ci-preserve.run1"
          "$exp/run.sh" --label ci-preserve --agents 5 --decisions 8 --interval 1 --resume-preserve --set society_cognition=true
          count=$(grep -c 'SOCIETY ev=restore agent=.* reset=false memories=[1-9]' "evidence/luanti/agent/ci-preserve.run1.log")
          test "$count" -eq 5
          grep -q 'SOCIETY summary .*decisions=40 ' "evidence/luanti/agent/ci-preserve.run1.log"
          "$exp/run.sh" --label ci-reset --agents 5 --decisions 8 --interval 1 --resume --set society_cognition=true
          count=$(grep -c 'SOCIETY ev=restore agent=.* reset=true memories=0' "evidence/luanti/agent/ci-reset.run1.log")
          test "$count" -eq 5
          python3 "$exp/snapshot.py" "$exp/worlds/ci-cognition.run1" "$exp/worlds/ci-invalid-retry.run1"
          "$exp/run.sh" --label ci-invalid-retry --agents 4 --decisions 8 --interval 1 --resume --expect-fail restore-invalid
          "$exp/run.sh" --label ci-invalid-retry --agents 5 --decisions 8 --interval 1 --resume --set society_cognition=true
      - name: Verify resource actions with deterministic fixture
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          exp=engine/luanti
          "$exp/run.sh" --label ci-resource --agents 3 --decisions 2 --interval 1 --seconds 60 --fake-model --set society_stats_interval=1 --set society_memory_mode=retrieval
          grep -q 'SOCIETY ev=resource .* action=gather ok=true' "evidence/luanti/agent/ci-resource.run1.log"
          grep -q 'SOCIETY ev=resource .* action=build ok=true' "evidence/luanti/agent/ci-resource.run1.log"
      - name: Verify long-term memory across normal restart
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          exp=engine/luanti
          "$exp/run.sh" --label ci-memory-persist --agents 3 --decisions 2 --interval 1 --seconds 60 --fake-model --long-term-memory
          python3 "$exp/snapshot.py" "$exp/worlds/ci-memory-persist.run1" "$exp/worlds/ci-memory-keep.run1"
          "$exp/run.sh" --label ci-memory-keep --agents 3 --decisions 2 --interval 1 --seconds 60 --fake-model --long-term-memory --resume-preserve
          test "$(grep -c 'SOCIETY ev=restore agent=.* reset=false' "evidence/luanti/agent/ci-memory-keep.run1.log")" -eq 3
          grep -q 'SOCIETY summary .*decisions=6 ' "evidence/luanti/agent/ci-memory-keep.run1.log"
          grep -q 'SOCIETY long-term-checkpoint records=[1-9]' "evidence/luanti/agent/ci-memory-keep.run1.log"
      - name: Verify a confirmed disposable Luanti world preview
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from genesis.preview import prepare_preview, launch
          from genesis.store import DraftStore
          root = Path('.ci-preview').absolute()
          root.mkdir(mode=0o700)
          draft = json.loads(Path('genesis/example.json').read_text(encoding='utf-8'))
          draft['actors'] = [dict(draft['actors'][0], id=ident, name=ident) for ident in ('alice', 'bob', 'cora')]
          draft['memories'] = [{'actorId': a['id'], 'text': 'A synthetic private memory.'} for a in draft['actors']]
          store = DraftStore(root / 'drafts.sqlite', create=True)
          try:
              record = store.create(draft)
              store.confirm(record['id'], record['revision'], root / 'origin.sqlite')
              preview, count = prepare_preview(store, record['id'], record['revision'], root)
          finally:
              store.close()
          rt = Path('engine/luanti/.runtime').absolute()
          status = launch(preview, count, engine=rt / 'root/usr/libexec/luanti/luantiserver',
                          runtime_home=rt / 'home', libdir=rt / 'root/usr/lib/x86_64-linux-gnu',
                          port=30077, seconds=120, fixture=True)
          log_path = preview / 'world/preview.log'
          log = log_path.read_text(errors='replace') if log_path.exists() else ''
          if status or 'SOCIETY ev=message ' not in log or 'origin=fixture' not in log:
              print('\n'.join(log.splitlines()[-60:]))
              raise SystemExit(status or 1)
          print('Confirmed fixture preview spawned and recorded messages; not a persistent world or model evidence.')
      - name: Create and run a persistent product world
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          from genesis.store import DraftStore
          from genesis.world_create import create_world
          root = Path('.ci-product').absolute()
          root.mkdir(mode=0o700)
          store = DraftStore(root / 'drafts.sqlite', create=True)
          try:
              draft = json.loads(Path('genesis/example.json').read_text(encoding='utf-8'))
              draft['title'] = '室内外恢复夹具'
              draft['description'] = '覆盖室内地板、室外地面和语义连接的产品重启夹具。'
              draft['places'] = [
                  {'id': 'home', 'name': '木屋', 'description': '带木地板和屋顶的室内地点。'},
                  {'id': 'yard', 'name': '院子', 'description': '连接木屋的室外地点。'},
              ]
              draft['actors'] = [dict(draft['actors'][0], id='traveler', name='Traveler', placeId='home')]
              draft['memories'] = [{'actorId': 'traveler', 'text': 'A private memory from upstream.'}]
              draft['layout'] = {
                  'places': [
                      {'placeId': 'home', 'space': 'indoor', 'grid': [0, 0]},
                      {'placeId': 'yard', 'space': 'outdoor', 'grid': [2, 0]},
                  ],
                  'connections': [{'from': 'home', 'to': 'yard'}],
              }
              record = store.create(draft)
              store.confirm(record['id'], record['revision'], root / 'origin.sqlite')
              result = create_world(store, record['id'], record['revision'], root / 'world')
              Path(root / 'creation-result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          finally:
              store.close()
          PY
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.ci-product/world/private/wispiva-origin.json').read_text(encoding='utf-8'))
          places = {place['id']: place['space'] for place in manifest['public']['places']}
          assert places == {'home': 'indoor', 'yard': 'outdoor'}
          assert manifest['public']['semantic_connections'] == [{'from': 'home', 'to': 'yard'}]
          print('product fixture covers indoor, outdoor and connected spaces')
          PY
          engine/luanti/run_product.sh --world "$GITHUB_WORKSPACE/.ci-product/world" --fake-model --decisions 3 --interval 1 --seconds 120
          grep -q 'SOCIETY origin projection ' .ci-product/world/private/product.log
          grep -q 'SOCIETY ev=environment ' .ci-product/world/private/product.log
          grep -q 'SOCIETY ev=genesis-memory agent=' .ci-product/world/private/product.log
          grep -q 'SOCIETY long-term-checkpoint records=' .ci-product/world/private/product.log
          grep -q 'SOCIETY product-checkpoint commit version=' .ci-product/world/private/product.log
          grep -q 'SOCIETY done result=ok' .ci-product/world/private/product.log

          grep -q 'memory_seeds' .ci-product/world/private/wispiva-origin.json
          engine/luanti/run_product.sh --world "$GITHUB_WORKSPACE/.ci-product/world" --fake-model --resume --decisions 2 --interval 1 --seconds 120
          grep -q 'SOCIETY ev=restore agent=.* reset=false' .ci-product/world/private/product.log
          ! grep -q 'SOCIETY fail=product-reconcile' .ci-product/world/private/product.log
          grep -q 'SOCIETY environment-checkpoint time=' .ci-product/world/private/product.log
          grep -q 'SOCIETY product-checkpoint commit version=' .ci-product/world/private/product.log
          grep -q 'SOCIETY done result=ok' .ci-product/world/private/product.log

      - name: Verify live product pause, speed and resume controls
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          set -euo pipefail
          world="$GITHUB_WORKSPACE/.ci-product/world"
          log="$GITHUB_WORKSPACE/.ci-product/control-server.log"
          engine/luanti/run_product.sh --world "$world" --fake-model --resume --serve --reflection-every 0 >"$log" 2>&1 &
          server=$!
          cleanup() {
            kill -TERM "$server" 2>/dev/null || true
            set +e
            wait "$server"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
              cat "$log" >&2
              return "$status"
            fi
            if pgrep -x luantiserver >/dev/null; then
              echo 'Luanti server remained after control test cleanup' >&2
              return 1
            fi
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 30); do
            if grep -q 'SOCIETY spawn count=' "$log"; then ready=1; break; fi
            if ! kill -0 "$server" 2>/dev/null; then cat "$log" >&2; exit 1; fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat "$log" >&2; exit 1; }
          python3 -B - <<'PY'
          import json
          import time
          from engine.luanti.control import send_command

          world = '.ci-product/world'
          initial = send_command(world, 'status')
          assert initial['ok'] and not initial['status']['paused'], initial
          paused = send_command(world, 'pause')
          assert paused['ok'] and paused['status']['paused'], paused
          frozen_at = paused['status']['logical_time']
          time.sleep(2)
          frozen = send_command(world, 'status')
          assert frozen['status']['paused'] and frozen['status']['logical_time'] == frozen_at, (paused, frozen)
          slowed = send_command(world, 'speed', rate=2)
          assert slowed['status']['paused'] and slowed['status']['rate'] == 2, slowed
          resumed = send_command(world, 'resume')
          assert resumed['ok'] and not resumed['status']['paused'], resumed
          time.sleep(3)
          advanced = send_command(world, 'status')
          assert advanced['status']['logical_time'] > resumed['status']['logical_time'], (resumed, advanced)
          send_command(world, 'pause')
          print(json.dumps({'pause_freezes_time': True, 'speed_while_paused': slowed['status']['rate'],
                            'resume_advances_time': True,
                            'logical_time_paused': frozen_at,
                            'logical_time_after_resume': advanced['status']['logical_time']}))
          PY
      - name: Verify persistent product world client acceptance
        if: ${{ !startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        run: |
          engine/luanti/view_acceptance.sh --world "$GITHUB_WORKSPACE/.ci-product/world" --seconds 60
      - name: Run real model product world with private memory audit
        if: ${{ startsWith(github.ref_name, 'validation/luanti-product-model-') && github.ref_name != 'validation/luanti-product-model-workers-20261030' }}
        env:
          XUNFEI_OPENAI_RESPONSE_URL: ${{ vars.XUNFEI_OPENAI_RESPONSE_URL }}
          XUNFEI_MODEL: ${{ vars.XUNFEI_MODEL }}
          XUNFEI_API_KEY: ${{ secrets.XUNFEI_LLM_API_KEY }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          from genesis.store import DraftStore
          from genesis.world_create import create_world
          root = Path('.ci-product-model').absolute()
          root.mkdir(mode=0o700)
          store = DraftStore(root / 'drafts.sqlite', create=True)
          try:
              draft = {
                  'schemaVersion': 1,
                  'title': 'A well-side meeting',
                  'description': 'Three residents meet beside a well and decide what to do with a green resource.',
                  'places': [{'id': 'well', 'name': 'The well', 'description': 'A shared meeting place beside a green resource.'}],
                  'actors': [
                      {'id': 'alice', 'name': 'Alice', 'role': 'scout',
                       'goal': 'On your first decision, say to Bob: I found a green resource by the well. Then gather it and react to feedback.', 'placeId': 'well'},
                      {'id': 'bob', 'name': 'Bob', 'role': 'listener',
                       'goal': 'Stay near Alice, respond to her greeting, then inspect the green resource.', 'placeId': 'well'},
                      {'id': 'cora', 'name': 'Cora', 'role': 'observer',
                       'goal': 'Observe quietly. You do not know Alice’s private discovery unless someone tells you.', 'placeId': 'well'},
                  ],
                  'memories': [
                      {'actorId': 'alice', 'text': 'I discovered a green resource by the well before this run and want Bob to know.'},
                      {'actorId': 'bob', 'text': 'I am waiting by the well and will listen to Alice.'},
                      {'actorId': 'cora', 'text': 'I was away from the well and do not know Alice’s discovery.'},
                  ],
                  'rules': [],
                  'layout': {'places': [{'placeId': 'well', 'space': 'outdoor', 'grid': [0, 0]}], 'connections': []},
              }
              record = store.create(draft)
              store.confirm(record['id'], record['revision'], root / 'origin.sqlite')
              result = create_world(store, record['id'], record['revision'], root / 'world')
              (root / 'creation-result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          finally:
              store.close()
          PY
          for _ in $(seq 1 30); do
            if ! pgrep -f 'luantiserver' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ! pgrep -f 'luantiserver' >/dev/null 2>&1
          engine/luanti/run_product.sh --world "$GITHUB_WORKSPACE/.ci-product-model/world" --decisions 8 --interval 1 --seconds 1200 --reflection-every 3 --audit-model
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          root = Path('.ci-product-model/world')
          log = (root / 'private/product.log').read_text(errors='replace')
          assert 'SOCIETY ev=model-action ' in log and 'origin=model' in log, 'no real model action was recorded'
          assert 'SOCIETY product-checkpoint commit ' in log and 'SOCIETY done result=ok' in log
          audit = root / 'private/model-audit'
          requests = sorted(audit.rglob('request-*.json'))
          responses = sorted(audit.rglob('response-*.json'))
          assert len(requests) >= 6 and len(responses) >= 6, (len(requests), len(responses))
          actor_by_runtime = {}
          request_rows = []
          for path in requests:
              value = json.loads(path.read_text())
              envelope = value['context']['model_input']
              actor = envelope['request']['actor_id']
              runtime = envelope['actor']['runtime_id']
              actor_by_runtime[runtime] = actor
              request_rows.append((actor, envelope))
          seeds = {
              'alice': 'I discovered a green resource by the well before this run and want Bob to know.',
              'bob': 'I am waiting by the well and will listen to Alice.',
              'cora': 'I was away from the well and do not know Alice’s discovery.',
          }
          actors = {actor for actor, _ in request_rows}
          assert actors == set(seeds), actors
          for actor, envelope in request_rows:
              encoded = json.dumps(envelope, ensure_ascii=False)
              assert seeds[actor] in encoded
              for other, seed in seeds.items():
                  if other != actor:
                      assert seed not in encoded, (actor, other)
          message_events = []
          delivered_messages = []
          pending_messages = []
          for path in responses:
              value = json.loads(path.read_text())
              action = value.get('action', {})
              if action.get('kind') != 'say':
                  continue
              target_actor = actor_by_runtime.get(action.get('target'))
              assert target_actor in actors, (action, actor_by_runtime)
              text = action['text']
              message_events.append({'target': target_actor, 'text': text})
              recipient_rows = [envelope for actor, envelope in request_rows if actor == target_actor]
              candidates = [item for envelope in recipient_rows
                            for item in (envelope.get('knowledge', {}).get('rumors') or [])
                            if item.get('text') == text and item.get('source', {}).get('kind') == 'agent_message']
              delivered = bool(candidates)
              if delivered:
                  delivered_messages.append({'target': target_actor, 'text': text})
                  for item in candidates:
                      source_id = item['source']['id']
                      assert item['access']['audience'] == [target_actor], (target_actor, item)
                      for other, envelope in request_rows:
                          if other == target_actor:
                              continue
                          assert all(source_id != other_item.get('source', {}).get('id') for other_item in (envelope.get('knowledge', {}).get('rumors') or [])), (target_actor, source_id, other)
              else:
                  pending_messages.append({'target': target_actor, 'text': text})
          assert message_events, 'real model did not produce a say action in the social scenario'
          assert delivered_messages, {'message_events': message_events, 'pending_messages': pending_messages}
          print(json.dumps({'requests': len(requests), 'responses': len(responses),
                            'actors': sorted(actors), 'message_events': message_events,
                            'delivered_messages': delivered_messages,
                            'pending_messages': pending_messages}, indent=2))
          PY
      - name: Verify live reflection writeback and resume
        if: ${{ startsWith(github.ref_name, 'validation/luanti-product-model-') && github.ref_name != 'validation/luanti-product-model-workers-20261030' }}
        env:
          XUNFEI_OPENAI_RESPONSE_URL: ${{ vars.XUNFEI_OPENAI_RESPONSE_URL }}
          XUNFEI_MODEL: ${{ vars.XUNFEI_MODEL }}
          XUNFEI_API_KEY: ${{ secrets.XUNFEI_LLM_API_KEY }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.ci-product-model"
          python3 -B -m validation.product_memory_audit --world "$root/world" --output "$root/memory-first.json" --save-checkpoint "$root/before-resume.json"
          cp "$root/world/private/product.log" "$root/first-run.log"
          engine/luanti/run_product.sh --world "$root/world" --resume --decisions 4 --interval 1 --seconds 900 --reflection-every 3 --audit-model
          python3 -B -m validation.product_memory_audit --world "$root/world" --before "$root/before-resume.json" --output "$root/memory-resumed.json"
      - name: Run user-intent free society product world
        if: ${{ startsWith(github.ref_name, 'validation/luanti-product-model-') }}
        env:
          XUNFEI_OPENAI_RESPONSE_URL: ${{ vars.XUNFEI_OPENAI_RESPONSE_URL }}
          XUNFEI_MODEL: ${{ vars.XUNFEI_MODEL }}
          XUNFEI_API_KEY: ${{ secrets.XUNFEI_LLM_API_KEY }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import re
          from pathlib import Path
          from genesis.store import DraftStore
          from genesis.model_adapter import responses_model
          from genesis.world_create import create_world
          from model.adapter import Config
          root = Path('.ci-free-social').absolute()
          root.mkdir(mode=0o700)
          intent = ('Create a free society in a small frontier settlement. The residents have no assigned jobs; '
                    'let them decide for themselves how to divide work, form friendships, exchange resources, '
                    'disagree, and change their settlement over time. Begin with a shared commons, a few scarce '
                    'resources, and four residents with different backgrounds. Preserve uncertainty where the '
                    'intent does not specify an outcome; do not script a predetermined story.')
          store = DraftStore(root / 'drafts.sqlite', create=True)
          try:
              record = store.create_from_intent(intent, responses_model(Config.from_env()))
              assert 3 <= len(record['draft']['actors']) <= 8, len(record['draft']['actors'])
              store.confirm(record['id'], record['revision'], root / 'origin.sqlite')
              result = create_world(store, record['id'], record['revision'], root / 'world')
              (root / 'creation-result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
              (root / 'intent.txt').write_text(intent, encoding='utf-8')
          finally:
              store.close()
          PY
