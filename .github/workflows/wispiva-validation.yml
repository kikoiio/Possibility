                             'incomplete' if reflection_attempts else 'not_requested'),
                  'complete_attempts': reflection_attempts - reflection_missing - reflection_invalid,
                  'missing_attempts': reflection_missing,
                  'invalid_attempts': reflection_invalid,
                  'input_tokens': reflection_usage['input_tokens'],
                  'output_tokens': reflection_usage['output_tokens'],
                  'total_tokens': reflection_usage['input_tokens'] + reflection_usage['output_tokens'],
              },
              'world_message_events': log.count('SOCIETY ev=message '),
              'world_resource_events': log.count('SOCIETY ev=resource '),
              'unsupported_genesis_feature_count': len(
                  json.loads(Path('genesis-results/results.json').read_text())[2]['unsupported']),
              'checkpoint_committed': 'SOCIETY product-checkpoint commit ' in log,
              'world_loop_completed': 'SOCIETY done result=ok' in log,
              'genesis_token_usage': json.loads(Path('genesis-results/results.json').read_text())[2]['token_usage'],
          }
          Path('cjk-product-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
