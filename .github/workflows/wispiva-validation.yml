          print(json.dumps({'created': True, 'actors': len(manifest['actors']),
                            'intent_sha256': digest, 'private_seed_counts': {
                                actor['actor_id']: len(actor['memory_seeds']) for actor in manifest['actors']}}))
          PY
          engine/luanti/run_product.sh --world "$GITHUB_WORKSPACE/.ci-cjk-world/world" --decisions 6 --interval 1 --seconds 1200 --reflection-every 2 --audit-model --model-workers 3
          python3 -B - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from model.product_envelope import validate

          root = Path('.ci-cjk-world')
          world = root / 'world'
          manifest = json.loads((world / 'private/wispiva-origin.json').read_text(encoding='utf-8'))
          log = (world / 'private/product.log').read_text(errors='replace')
          assert 'SOCIETY ev=model-action ' in log and 'origin=model' in log
          assert 'SOCIETY product-checkpoint commit ' in log and 'SOCIETY done result=ok' in log
          requests = sorted((world / 'private/model-audit').rglob('request-*.json'))
          responses = sorted((world / 'private/model-audit').rglob('response-*.json'))
          assert len(requests) >= 6 and len(responses) >= 6, (len(requests), len(responses))
          action_counts = Counter()
          usage_totals = Counter()
          usage_missing = 0
          usage_invalid = 0
          provider_attempts = 0
          reflection_usage = Counter()
          reflection_missing = 0
          reflection_invalid = 0
          reflection_attempts = 0
          for path in responses:
              response = json.loads(path.read_text(encoding='utf-8'))
              action = response.get('action', {})
              if isinstance(action, dict) and isinstance(action.get('kind'), str):
                  action_counts[action['kind']] += 1
              for attempt in response.get('attempts') or []:
                  provider_attempts += 1
                  usage = ((attempt.get('audit') or {}).get('usage') or {})
                  if usage.get('invalid') is True:
                      usage_invalid += 1
                  elif all(type(usage.get(key)) is int and usage[key] >= 0
                           for key in ('input_tokens', 'output_tokens')):
                      usage_totals['input_tokens'] += usage['input_tokens']
                      usage_totals['output_tokens'] += usage['output_tokens']
                  else:
                      usage_missing += 1
                  reflection = attempt.get('reflection_audit')
                  if reflection is not None:
                      reflection_attempts += 1
                      usage = (reflection.get('usage') or {}) if isinstance(reflection, dict) else {}
                      if usage.get('invalid') is True:
                          reflection_invalid += 1
                      elif all(type(usage.get(key)) is int and usage[key] >= 0
                               for key in ('input_tokens', 'output_tokens')):
                          reflection_usage['input_tokens'] += usage['input_tokens']
                          reflection_usage['output_tokens'] += usage['output_tokens']
                      else:
                          reflection_missing += 1
          assert sum(action_counts.values()) >= 6, action_counts
          usage_status = ('invalid' if usage_invalid else
                          'complete' if provider_attempts and not usage_missing else 'incomplete')
          seeds = {actor['actor_id']: [seed['text'] for seed in actor['memory_seeds']]
                   for actor in manifest['actors']}
          seen_actors = set()
          own_seed_seen = set()
          for path in requests:
              value = json.loads(path.read_text(encoding='utf-8'))
              envelope = value['context']['model_input']
              assert validate(envelope)
              actor = envelope['request']['actor_id']
              assert actor in seeds
              seen_actors.add(actor)
              encoded = json.dumps(envelope, ensure_ascii=False)
              for other, actor_seeds in seeds.items():
                  for seed in actor_seeds:
                      if other == actor:
                          if seed in encoded:
                              own_seed_seen.add(actor)
                      else:
                          assert seed not in encoded, (actor, other)
          assert seen_actors == set(seeds), seen_actors
          assert own_seed_seen == set(seeds), own_seed_seen
          summary = {
              'world_created': True,
              'actors': len(seeds),
              'requests': len(requests),
              'responses': len(responses),
              'actors_observed_by_model': len(seen_actors),
              'actors_with_own_seed_in_model_input': len(own_seed_seen),
              'private_seed_cross_actor_leaks': 0,
              'model_action_counts': dict(sorted(action_counts.items())),
              'provider_attempts': provider_attempts,
              'provider_token_usage': {
                  'status': usage_status,
                  'complete_attempts': provider_attempts - usage_missing - usage_invalid,
                  'missing_attempts': usage_missing,
                  'invalid_attempts': usage_invalid,
                  'input_tokens': usage_totals['input_tokens'],
                  'output_tokens': usage_totals['output_tokens'],
                  'total_tokens': usage_totals['input_tokens'] + usage_totals['output_tokens'],
              },
              'reflection_attempts': reflection_attempts,
              'reflection_token_usage': {
