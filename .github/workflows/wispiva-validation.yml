          for cognition in false true; do
            rc=0
            "$exp/run.sh" --label "ci-repeat-${cognition}" --agents 1000 --decisions 12 --interval 2 --seconds 90 --repeat 3 --set society_bound=64 --set society_spacing=2 --set society_cognition="$cognition" || rc=$?
            echo "cognition=$cognition exit=$rc" >> "evidence/luanti/agent/ci-repeat-status.txt"
          done
      - name: Explore interactions with and without memory
        if: ${{ startsWith(github.ref_name, 'validation/luanti-model-') }}
        env:
          XUNFEI_OPENAI_RESPONSE_URL: ${{ vars.XUNFEI_OPENAI_RESPONSE_URL }}
          XUNFEI_MODEL: ${{ vars.XUNFEI_MODEL }}
          XUNFEI_API_KEY: ${{ secrets.XUNFEI_LLM_API_KEY }}
        run: |
          exp=engine/luanti
          "$exp/run.sh" --label ci-base --agents 3 --decisions 8 --interval 1 --set society_spacing=2 --set society_seed_resources=true --set society_cognition=true
          for trial in 1 2 3; do
            order="true false"
            if [ "$trial" = 2 ]; then order="false true"; fi
            for memory in $order; do
              label="ci-memory-${memory}-${trial}"
              python3 "$exp/snapshot.py" "$exp/worlds/ci-base.run1" "$exp/worlds/${label}.run1"
              rc=0
              "$exp/run.sh" --label "$label" --agents 3 --decisions 8 --interval 1 --seconds 600 --resume --model --set society_spacing=2 --set society_model_memory="$memory" --set society_log_messages=true --set 'society_goal=Work with nearby agents to gather resources and build a shared structure. Tell a neighbor your plan or progress. Choose actions yourself; evaluate feedback and adjust.' || rc=$?
              echo "trial=$trial memory=$memory exit=$rc" >> "evidence/luanti/agent/ci-memory-status.txt"
            done
          done
          ! grep -qv 'exit=0' "evidence/luanti/agent/ci-memory-status.txt"
      - name: Summarize observed results
        if: always()
        run: |
          python3 -B validation/luanti/analysis/summarize.py --compact --input evidence/luanti/agent --output observed-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wispiva-results-${{ matrix.count }}
          path: |
            memory-results/
            observed-results.json
            run-metadata.json
            scale-results/
            evidence/luanti/agent/ci-cognition.*
            evidence/luanti/agent/ci-model.*
            evidence/luanti/agent/ci-reset.*
            evidence/luanti/agent/ci-preserve.*
            evidence/luanti/agent/ci-invalid-retry.*
            evidence/luanti/agent/ci-agent-*
            evidence/luanti/agent/ci-resource.*
            evidence/luanti/agent/ci-memory-*
            genesis-results/
            evidence/luanti/agent/ci-large-*
            evidence/luanti/agent/ci-repeat-*
            evidence/luanti/agent/ci-opt-*
            unit-tests.log
          if-no-files-found: warn
          retention-days: 14
